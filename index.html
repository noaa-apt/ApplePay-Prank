<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Apple Cash</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      height: 100%;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      color: #fff;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    #main-screen {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 16px 20px 40px;
      overflow-y: auto;
    }

    .card-wrapper {
      width: 100%;
      max-width: 380px;
      margin: 10px auto 24px;
    }

    .apple-cash-card {
      width: 100%;
      aspect-ratio: 1.7 / 1;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      background: #111;
    }

    .apple-cash-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card-fallback {
      width: 100%;
      height: 100%;
      background: linear-gradient(160deg, #1a1a1a, #0d0d0d);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 15px;
      text-align: center;
      padding: 20px;
    }

    .balance-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 380px;
      margin: 0 auto 28px;
      width: 100%;
    }

    .balance-left {
      display: flex;
      flex-direction: column;
    }

    .balance-label {
      font-size: 15px;
      color: #8e8e93;
      margin-bottom: 2px;
    }

    .balance-amount {
      font-size: 34px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .send-request-btn {
      background: #1c1c1e;
      border: 1px solid #3a3a3c;
      color: #fff;
      font-size: 16px;
      font-weight: 500;
      padding: 10px 18px;
      border-radius: 980px;
      cursor: pointer;
    }

    .send-request-btn:active {
      opacity: 0.7;
    }

    .section-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 12px;
      max-width: 380px;
      margin-left: auto;
      margin-right: auto;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .transactions {
      max-width: 380px;
      margin: 0 auto;
      width: 100%;
    }

    .tx-item {
      display: flex;
      align-items: center;
      padding: 12px 0;
      border-bottom: 0.5px solid #1c1c1e;
    }

    .tx-item:last-child {
      border-bottom: none;
    }

    .tx-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #1c1c1e;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      flex-shrink: 0;
      font-size: 16px;
      color: #8e8e93;
    }

    .tx-content {
      flex: 1;
      min-width: 0;
    }

    .tx-title {
      font-size: 16px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tx-subtitle {
      font-size: 14px;
      color: #8e8e93;
      margin-top: 1px;
    }

    .tx-right {
      text-align: right;
      margin-left: 12px;
      flex-shrink: 0;
    }

    .tx-amount {
      font-size: 16px;
      font-weight: 500;
      color: #30d158;
    }

    .tx-chevron {
      color: #3a3a3c;
      font-size: 14px;
      margin-top: 2px;
    }

    .empty {
      text-align: center;
      color: #636366;
      padding: 50px 0;
      font-size: 16px;
    }
    #request-screen {
      height: 100%;
      display: none;
      flex-direction: column;
      background: #000;
    }

    .req-header {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 18px 20px;
      padding-top: 16px;
    }

    .back-btn {
      position: absolute;
      left: 16px;
      background: none;
      border: none;
      color: #fff;
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
      padding: 4px 8px;
    }

    .req-title {
      font-size: 17px;
      font-weight: 600;
    }

    .amount-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-bottom: 20px;
    }

    .big-amount {
      font-size: 72px;
      font-weight: 600;
      letter-spacing: -2px;
      margin-bottom: 12px;
    }

    .big-amount.placeholder {
      color: #3a3a3c;
    }

    .note-placeholder {
      font-size: 17px;
      color: #636366;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      padding: 0 40px 20px;
      max-width: 340px;
      margin: 0 auto;
      width: 100%;
    }

    .key {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: #1c1c1e;
      border: none;
      color: #fff;
      font-size: 32px;
      font-weight: 400;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      cursor: pointer;
    }

    .key:active {
      background: #2c2c2e;
    }

    .key.delete {
      font-size: 26px;
    }

    .continue-btn {
      margin: 10px 20px 40px;
      background: #1c1c1e;
      color: #fff;
      border: none;
      border-radius: 980px;
      padding: 18px;
      font-size: 17px;
      font-weight: 600;
      width: calc(100% - 40px);
      max-width: 360px;
      margin-left: auto;
      margin-right: auto;
      display: block;
      cursor: pointer;
    }

    .continue-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .continue-btn:active:not(:disabled) {
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div id="main-screen">
    <div class="card-wrapper">
      <div class="apple-cash-card">
        <img src="/src/card.png" alt="Apple Cash" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
        <div class="card-fallback" style="display:none;">
          Unable to load Card<br
        </div>
      </div>
    </div>

    <div class="balance-row">
      <div class="balance-left">
        <div class="balance-label">Balance</div>
        <div class="balance-amount" id="balance">$0.00</div>
      </div>
      <button class="send-request-btn" onclick="showRequest()">Send or Request</button>
    </div>

    <div class="section-title">
      Latest Transactions
    </div>

    <div class="transactions" id="transactions">
      <div class="empty">No transactions</div>
    </div>
  </div>
  <div id="request-screen">
    <div class="req-header">
      <button class="back-btn" onclick="hideRequest()">‹</button>
      <div class="req-title">Tap to Cash</div>
    </div>

    <div class="amount-area">
      <div class="big-amount placeholder" id="amount-display">$0</div>
      <div class="note-placeholder">Add a note...</div>
    </div>

    <div class="keypad" id="keypad">
      <button class="key" data-key="1">1</button>
      <button class="key" data-key="2">2</button>
      <button class="key" data-key="3">3</button>
      <button class="key" data-key="4">4</button>
      <button class="key" data-key="5">5</button>
      <button class="key" data-key="6">6</button>
      <button class="key" data-key="7">7</button>
      <button class="key" data-key="8">8</button>
      <button class="key" data-key="9">9</button>
      <button class="key" data-key=".">.</button>
      <button class="key" data-key="0">0</button>
      <button class="key delete" data-key="delete">⌫</button>
    </div>

    <button class="continue-btn" id="continue-btn" disabled onclick="doRequest()">
      Continue
    </button>
  </div>

  <audio id="sound" preload="auto">
    <source src="src/applepay.mp3" type="audio/mpeg">
  </audio>

  <script>
    let currentAmount = "";
    let balance = 0;
    let transactions = [];

    const balanceEl = document.getElementById('balance');
    const amountDisplay = document.getElementById('amount-display');
    const continueBtn = document.getElementById('continue-btn');
    const transactionsEl = document.getElementById('transactions');
    const sound = document.getElementById('sound');
    document.getElementById('keypad').addEventListener('click', (e) => {
      const key = e.target.closest('.key')?.dataset.key;
      if (!key) return;

      if (key === 'delete') {
        currentAmount = currentAmount.slice(0, -1);
      } else if (key === '.') {
        if (!currentAmount.includes('.')) {
          currentAmount = currentAmount === '' ? '0.' : currentAmount + '.';
        }
      } else {
        if (currentAmount.includes('.')) {
          const parts = currentAmount.split('.');
          if (parts[1] && parts[1].length >= 2) return;
        }
        if (currentAmount === '0') {
          currentAmount = key;
        } else {
          currentAmount += key;
        }
      }
      updateAmountDisplay();
    });

    function updateAmountDisplay() {
      if (!currentAmount || currentAmount === '0') {
        amountDisplay.textContent = '$0';
        amountDisplay.classList.add('placeholder');
        continueBtn.disabled = true;
      } else {
        let num = parseFloat(currentAmount);
        if (currentAmount.endsWith('.')) {
          amountDisplay.textContent = '$' + currentAmount;
        } else {
          amountDisplay.textContent = '$' + num.toLocaleString('en-US', {
            minimumFractionDigits: currentAmount.includes('.') ? currentAmount.split('.')[1].length : 0,
            maximumFractionDigits: 2
          });
        }
        amountDisplay.classList.remove('placeholder');
        continueBtn.disabled = false;
      }
    }

    function showRequest() {
      currentAmount = '';
      updateAmountDisplay();
      document.getElementById('main-screen').style.display = 'none';
      document.getElementById('request-screen').style.display = 'flex';
    }

    function hideRequest() {
      document.getElementById('request-screen').style.display = 'none';
      document.getElementById('main-screen').style.display = 'flex';
    }

    function doRequest() {
      const amount = parseFloat(currentAmount);
      if (!amount || amount <= 0) return;
      sound.currentTime = 0;
      sound.play().catch(() => {});
      if (navigator.vibrate) navigator.vibrate([35, 25, 55]);
      balance += amount;

      const now = new Date();
      const timeStr = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

      transactions.unshift({
        title: 'Tap to Cash',
        subtitle: 'Added to Balance • ' + timeStr,
        amount: amount
      });

      updateMainUI();
      hideRequest();
    }

    function updateMainUI() {
      balanceEl.textContent = '$' + balance.toLocaleString('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });

      if (transactions.length === 0) {
        transactionsEl.innerHTML = '<div class="empty">No transactions</div>';
      } else {
        transactionsEl.innerHTML = transactions.map(tx => `
          <div class="tx-item">
            <div class="tx-icon">$</div>
            <div class="tx-content">
              <div class="tx-title">${tx.title}</div>
              <div class="tx-subtitle">${tx.subtitle}</div>
            </div>
            <div class="tx-right">
              <div class="tx-amount">+$${tx.amount.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
              <div class="tx-chevron">›</div>
            </div>
          </div>
        `).join('');
      }
    }
    updateMainUI();
  </script>
</body>
</html>
